name: Release

# A tag X.Y.Z (or X.Y.Z-prerelease) on main publishes the release on GitHub and on npm.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}
  VERSION_TAG_REGEX: ${{ vars.VERSION_TAG_REGEX }}
  PACKAGE: "@stanislas-poisson/js-dev-tools"

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Check the format of the tag
        run: |
          if [ -z "$VERSION_TAG_REGEX" ]; then
            echo "::error::The variable VERSION_TAG_REGEX of the repository is not set."
            exit 1
          fi
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq "$VERSION_TAG_REGEX"; then
            echo "::error::The tag $GITHUB_REF_NAME does not match $VERSION_TAG_REGEX (X.Y.Z or X.Y.Z-prerelease)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main: a release is made from main only."
            exit 1
          fi

      - name: Check the CI passed on the tagged commit
        run: |
          for attempt in $(seq 1 40); do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "ci")] | first | .conclusion // "missing"')

            case "$conclusion" in
              success) echo "The CI passed."; exit 0 ;;
              missing|null) echo "The CI has not finished ($attempt/40), waiting." ;;
              *) echo "::error::The CI of $GITHUB_SHA ended with: $conclusion."; exit 1 ;;
            esac

            sleep 30
          done

          echo "::error::The CI of $GITHUB_SHA did not finish in 20 minutes."
          exit 1

      - name: Create the release
        run: |
          # A pre-release is required by its exact version, a final one by its minor version
          constraint="$GITHUB_REF_NAME"
          flags=(--latest)
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            flags=(--prerelease --latest=false)
          else
            constraint="^${GITHUB_REF_NAME%.*}"
          fi

          cat > notes.md <<NOTES
          \`\`\`bash
          npm install --save-dev $PACKAGE@$constraint
          \`\`\`

          Package: https://www.npmjs.com/package/$PACKAGE

          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "js-dev-tools $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the version of the package is the tag
        run: |
          if [ "$(node -p "require('./package.json').version")" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json does not hold the version $GITHUB_REF_NAME."
            exit 1
          fi

      # With trusted publishing the token is not needed: npm trusts this workflow. The token only serves the first
      # publication, before the package exists on npm.
      - name: Publish on npm
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          if [[ $GITHUB_REF_NAME == *-* ]]; then tag=next; fi

          npm publish --provenance --access public --tag "$tag"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      # The zairakai JS tools (GitLab) require this package: they take the new version by themselves. The weekly
      # schedule of @zairakai/js-dev-tools catches up if this call is missed, and the update does nothing when
      # it is already done.
      - name: Start the update of @zairakai/js-dev-tools
        if: steps.npm.outputs.listed == 'true' && !contains(github.ref_name, '-')
        env:
          TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          PROJECT_ID: ${{ vars.GITLAB_TRIGGER_PROJECT_ID }}
        run: |
          if [ -z "$TRIGGER_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::warning::GITLAB_TRIGGER_TOKEN or GITLAB_TRIGGER_PROJECT_ID is not set: @zairakai/js-dev-tools is not started."
            exit 0
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            --form "token=$TRIGGER_TOKEN" --form "ref=develop" --form "variables[UPDATE_DEPENDENCIES]=true" \
            "https://gitlab.com/api/v4/projects/$PROJECT_ID/trigger/pipeline")

          if [ "$status" != "201" ]; then
            echo "::warning::The update of @zairakai/js-dev-tools was not started (HTTP $status)."
          else
            echo "The update of @zairakai/js-dev-tools is started."
          fi
