version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # The packages held back are the ones of the dependency policy: update-dependencies dependabot-sync keeps this block.
    # BEGIN dependency-policy (npm)
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "@prettier/plugin-php"
      - dependency-name: "policy-sync-test-package"
    # END dependency-policy (npm)

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
